<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GERPI reestri — GERPI Monitoring</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <div class="layout">
    <div class="main">
      <div class="content">
        <div class="page-title">GERPI reestri</div>
        <div class="page-sub">Loyihalarni amalga oshirish guruhlari ro'yxati</div>

        <div class="toolbar">
          <input type="text" class="search-input" id="f-search" placeholder="Qidirish: nomi, bitim raqami…">
          <select id="f-ministry"><option value="">Barcha vazirliklar</option></select>
          <select id="f-donor"><option value="">Barcha donorlar</option></select>
          <select id="f-status">
            <option value="">Barcha holatlar</option>
            <option value="tayyorgarlik">Tayyorgarlik</option>
            <option value="faol">Faol</option>
            <option value="kechikayotgan">Kechikayotgan</option>
            <option value="yakunlangan">Yakunlangan</option>
            <option value="toxtatilgan">To'xtatilgan</option>
          </select>
          <select id="f-risk">
            <option value="">Barcha risklar</option>
            <option value="past">Past risk</option>
            <option value="orta">O'rta risk</option>
            <option value="yuqori">Yuqori risk</option>
          </select>
          <div class="spacer"></div>
          <button class="btn btn-primary" id="btn-add" hidden>+ Yangi GERPI</button>
        </div>

        <div class="card table-card">
          <div class="table-scroll">
            <table id="orgs-table">
              <thead>
                <tr>
                  <th class="sortable" data-sort="name">Tashkilot</th>
                  <th>Vazirlik</th>
                  <th>Donor</th>
                  <th class="sortable" data-sort="budget">Byudjet</th>
                  <th class="sortable" data-sort="disbursed">O'zlashtirish</th>
                  <th class="sortable" data-sort="end_year">Muddat</th>
                  <th class="sortable" data-sort="status">Holat</th>
                  <th class="sortable" data-sort="risk">Risk</th>
                </tr>
              </thead>
              <tbody id="orgs-tbody"></tbody>
            </table>
          </div>
          <div class="pagination" id="pagination"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Detail modal -->
  <div class="modal-backdrop" id="detail-backdrop">
    <div class="modal">
      <div class="modal-head">
        <h2 id="detail-title">GERPI profili</h2>
        <button class="modal-close" data-close="detail-backdrop">×</button>
      </div>
      <div class="modal-body" id="detail-body"></div>
      <div class="modal-foot" id="detail-foot"></div>
    </div>
  </div>

  <!-- Create / edit modal -->
  <div class="modal-backdrop" id="edit-backdrop">
    <div class="modal">
      <div class="modal-head">
        <h2 id="edit-title">Yangi GERPI</h2>
        <button class="modal-close" data-close="edit-backdrop">×</button>
      </div>
      <div class="modal-body">
        <form id="edit-form" class="form-grid">
          <div class="form-field full">
            <label for="e-name">Nomi (o'zbek lotin) *</label>
            <input type="text" id="e-name" required>
          </div>
          <div class="form-field">
            <label for="e-ministry">Vazirlik *</label>
            <select id="e-ministry" required></select>
          </div>
          <div class="form-field">
            <label for="e-donor">Donor *</label>
            <select id="e-donor" required></select>
          </div>
          <div class="form-field">
            <label for="e-budget">Byudjet (USD) *</label>
            <input type="number" id="e-budget" min="0" step="1000" required>
          </div>
          <div class="form-field">
            <label for="e-agreement">Bitim raqami</label>
            <input type="text" id="e-agreement">
          </div>
          <div class="form-field">
            <label for="e-start">Boshlanish yili</label>
            <input type="number" id="e-start" min="2000" max="2050">
          </div>
          <div class="form-field">
            <label for="e-end">Tugash yili</label>
            <input type="number" id="e-end" min="2000" max="2060">
          </div>
          <div class="form-field">
            <label for="e-closing">Yopilish sanasi</label>
            <input type="date" id="e-closing">
          </div>
          <div class="form-field">
            <label for="e-status">Holat</label>
            <select id="e-status">
              <option value="tayyorgarlik">Tayyorgarlik</option>
              <option value="faol">Faol</option>
              <option value="kechikayotgan">Kechikayotgan</option>
              <option value="yakunlangan">Yakunlangan</option>
              <option value="toxtatilgan">To'xtatilgan</option>
            </select>
          </div>
          <div class="form-field">
            <label for="e-director">Direktor F.I.Sh.</label>
            <input type="text" id="e-director">
          </div>
          <div class="form-field">
            <label for="e-phone">Telefon</label>
            <input type="text" id="e-phone">
          </div>
        </form>
        <div class="form-error" id="edit-error"></div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-secondary" data-close="edit-backdrop">Bekor qilish</button>
        <button class="btn btn-primary" id="btn-save">Saqlash</button>
      </div>
    </div>
  </div>

  <script src="/assets/app.js"></script>
  <script src="/assets/orgs.js"></script>
</body>
</html>
