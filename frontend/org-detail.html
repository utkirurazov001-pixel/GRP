<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GERPI profili — GERPI Monitoring</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <div class="layout">
    <div class="main">
      <div class="content">
        <div class="org-head card" style="padding:18px" id="org-head">
          <div class="skeleton" style="width:100%;height:48px"></div>
        </div>

        <div class="tabs" id="tabs">
          <button class="tab active" data-tab="overview">Umumiy</button>
          <button class="tab" data-tab="disbursements">O'zlashtirish tarixi</button>
          <button class="tab" data-tab="components">Komponentlar</button>
          <button class="tab" data-tab="procurements">Xaridlar</button>
          <button class="tab" data-tab="documents">Hujjatlar</button>
          <button class="tab" data-tab="alerts">Ogohlantirishlar <span class="badge red" id="alert-badge" hidden></span></button>
        </div>

        <div id="tab-overview" class="tab-pane"></div>
        <div id="tab-disbursements" class="tab-pane" hidden></div>
        <div id="tab-components" class="tab-pane" hidden></div>
        <div id="tab-procurements" class="tab-pane" hidden></div>
        <div id="tab-documents" class="tab-pane" hidden></div>
        <div id="tab-alerts" class="tab-pane" hidden></div>
      </div>
    </div>
  </div>

  <!-- Reject report modal -->
  <div class="modal-backdrop" id="reject-backdrop">
    <div class="modal" style="max-width:480px">
      <div class="modal-head">
        <h2>Hisobotni qaytarish</h2>
        <button class="modal-close" data-close="reject-backdrop">×</button>
      </div>
      <div class="modal-body">
        <div class="form-field full">
          <label for="reject-comment">Qaytarish sababi (kamida 10 belgi) *</label>
          <textarea id="reject-comment" rows="4" placeholder="Nima uchun hisobot qaytarilmoqda…"></textarea>
        </div>
        <div class="form-error" id="reject-error"></div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-secondary" data-close="reject-backdrop">Bekor qilish</button>
        <button class="btn btn-danger" id="btn-reject-confirm">Qaytarish</button>
      </div>
    </div>
  </div>

  <!-- Upload document modal -->
  <div class="modal-backdrop" id="upload-backdrop">
    <div class="modal" style="max-width:520px">
      <div class="modal-head">
        <h2>Hujjat yuklash</h2>
        <button class="modal-close" data-close="upload-backdrop">×</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-field full">
            <label for="u-title">Hujjat nomi *</label>
            <input type="text" id="u-title">
          </div>
          <div class="form-field">
            <label for="u-type">Turi</label>
            <select id="u-type">
              <option value="choraklik_hisobot">Choraklik hisobot</option>
              <option value="yillik_reja">Yillik reja</option>
              <option value="audit_hisoboti">Audit hisoboti</option>
              <option value="donor_missiya">Donor missiyasi</option>
              <option value="shartnoma">Shartnoma</option>
              <option value="boshqa" selected>Boshqa</option>
            </select>
          </div>
          <div class="form-field">
            <label for="u-file">Fayl (PDF/DOCX/XLSX/JPG/PNG, maks 20MB) *</label>
            <input type="file" id="u-file" accept=".pdf,.docx,.xlsx,.jpg,.jpeg,.png">
          </div>
        </div>
        <div class="form-error" id="upload-error"></div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-secondary" data-close="upload-backdrop">Bekor qilish</button>
        <button class="btn btn-primary" id="btn-upload-confirm">Yuklash</button>
      </div>
    </div>
  </div>

  <script src="/assets/vendor/chart.umd.min.js"></script>
  <script src="/assets/app.js"></script>
  <script src="/assets/org-detail.js"></script>
</body>
</html>
